{{- /*
ENCRYPTION AT REST IS A CHOICE THE CHART MAKES YOU MAKE.

Without a key ISR keeps upstream service tokens, the internal CA private key and
object-store credentials in PLAINTEXT. It warns once at boot — which on a
cluster is a line in a pod log nobody reads. So the default fails the install
instead, and names the two ways to fix it.
*/ -}}
{{- if and .Values.encryption.required (not .Values.encryption.existingSecret) (not .Values.encryption.key) }}
{{- fail "\n\nISR would store upstream tokens, the internal CA key and object-store credentials in PLAINTEXT.\n\nSet ONE of:\n  encryption.existingSecret=<name>   (preferred — the key never enters a values file)\n      kubectl create secret generic isr-encryption \\\n        --from-literal=key=\"$(openssl rand -base64 32)\"\n  encryption.key=<32 bytes, base64 or hex>\n\nFor a throwaway evaluation only: encryption.required=false\n" }}
{{- end }}
{{- if and .Values.encryption.key (not .Values.encryption.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isr.fullname" . }}-encryption
  labels:
    {{- include "isr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.encryption.secretKey }}: {{ .Values.encryption.key | quote }}
  {{- with .Values.encryption.previousKey }}
  key-old: {{ . | quote }}
  {{- end }}
{{- end }}
