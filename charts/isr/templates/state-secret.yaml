{{- if and (eq .Values.state.backend "postgres") (not .Values.state.postgres.existingSecret) }}
{{- if not .Values.state.postgres.dsn }}
{{- fail "state.backend=postgres needs either state.postgres.existingSecret or state.postgres.dsn" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isr.fullname" . }}-state
  labels:
    {{- include "isr.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.state.postgres.dsn | quote }}
{{- end }}
